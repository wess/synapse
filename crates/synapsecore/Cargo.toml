# Its own workspace root rather than a member of the one above, for the same
# reason as synapseserve: Cargo reads every workspace member's manifest whatever
# you asked it to build, so as a member this crate would still resolve the
# desktop's GPUI and guise graph on a terminal-only machine that never links it.
#
# Feature-gating the desktop dependency does not work and neither does
# target-gating it. Cargo builds the resolve graph before it applies features or
# targets, so it resolves the desktop dependency graph even
# when nothing will link it. A package that must build without guise is a
# package that must not name guise.
#
# The cost is that dependency versions are written out here instead of
# inherited, and that a workspace-wide `cargo test` at the repository root does
# not reach these tests. CI runs them in their own job, on Linux, without the
# desktop graph — which is what keeps the property above from quietly regressing.
[workspace]

[package]
name = "synapsecore"
# Keep this in step with crates/synapse: `synapse version` reads the version of
# the crate that holds the command, and the two ship as one product. Only the
# desktop crate's version triggers the release workflow.
version = "1.3.1"
edition = "2024"
description = "Memory, credentials, and the command surface for Synapse, without a window"

# A library with the `synapse-cli` binary over it. The desktop crate links the
# library and adds a window; a terminal-only machine builds this crate alone.
[[bin]]
name = "synapse-cli"
path = "src/main.rs"

[dependencies]
synapsesync = { path = "../synapsesync" }
anyhow = "1.0"
# The only HTTP client here, and it exists for sync alone. rustls rather than
# the platform's TLS so a Linux box needs no system OpenSSL, and no default
# features so this does not quietly bring a second async runtime with it.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# The vault's encrypted backend. Same primitive and same version as the sync
# envelopes, so there is one AEAD in this repository rather than two.
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
fs2 = "0.4"
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
rpassword = "7.5"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.0.0-rc.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1.0", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "0.9"

# The terminal dashboard. crossterm comes through ratatui's re-export rather
# than as a dependency of its own, so the two can never drift to versions that
# disagree about what a key event is.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
], optional = true }

# On by default because the binary is the reason this crate exists. An embedder
# that wants the library and not a screen turns it off:
#   synapsecore = { version = "*", default-features = false }
[features]
default = ["tui"]
tui = ["dep:ratatui"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Keychain backend. It is one of two: the encrypted store needs nothing
# from the platform, so off macOS the vault holds values like everywhere else
# and only `vault backend keychain` is unavailable.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3.20"
