[advisories]
# This crate is its own workspace root, so `cargo audit` run here does not read
# the repository's `.cargo/audit.toml`. The reasoning for this exception lives
# there, beside the others: bundled SQLite, no sqlx release that accepts the
# fixed libsqlite3-sys, and the one path that opens a file somebody else could
# have written refuses a write-ahead log before SQLite sees it.
ignore = ["RUSTSEC-2026-0459"]
