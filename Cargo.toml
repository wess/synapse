[workspace]
members = ["crates/synapse", "crates/synapsesync"]
# synapseserve is its own workspace root, not a member here. Cargo loads every
# member's manifest whatever you asked it to build, so as a member it could not
# be built without ../guise on disk — a headless Linux server would have needed
# a checkout of a GPUI theming library it never links. It keeps its own
# lockfile, which also matches how it ships: on its own schedule.
exclude = ["crates/synapseserve"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# guise-ui is a path dependency on a sibling checkout. It is declared here
# rather than in the package so the path stays relative to the workspace root:
# CI checks guise out beside this repository, not beside the crate.
guise-ui = { path = "../guise/crates/guise", default-features = false }

# Shared by more than one crate. Desktop-only dependencies (gpui, cocoa,
# tray-icon, rmcp, and the rest) stay in the package that needs them, so a
# server build never resolves them.
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlite",
] }
tempfile = "3.20"
tokio = { version = "1.0", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
