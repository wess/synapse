[workspace]
members = ["crates/synapse", "crates/synapsesync"]
# synapsecore and synapseserve are their own workspace roots, not members here.
# Cargo loads every member's manifest whatever you asked it to build, so as
# members they could not be built without ../guise on disk — a terminal-only
# machine would have needed a checkout of a GPUI theming library it never
# links. Each keeps its own lockfile, which also matches how they ship: on
# their own schedules.
#
# Being excluded is not the same as being unreachable: crates/synapse depends on
# synapsecore by path, so building this workspace still builds it.
exclude = ["crates/synapsecore", "crates/synapseserve"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# guise-ui is a path dependency on a sibling checkout. It is declared here
# rather than in the package so the path stays relative to the workspace root:
# CI checks guise out beside this repository, not beside the crate.
guise-ui = { path = "../guise/crates/guise", default-features = false }

# Shared by more than one crate. Desktop-only dependencies (gpui, cocoa,
# tray-icon, rmcp, and the rest) stay in the package that needs them, so a
# server build never resolves them.
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlite",
] }
tempfile = "3.20"
tokio = { version = "1.0", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
