name: Release

on:
  push:
    branches: [main]
    paths:
      # The desktop app's own manifest. Crates version independently, so a
      # server-only release must not drag the signed, notarized Mac build
      # along with it.
      - "crates/synapse/Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      # Release when the package version has no matching tag yet. Idempotent
      # for both push and manual dispatch (a HEAD~1 diff would miss dispatches
      # and re-released versions).
      - name: Read package version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' crates/synapse/Cargo.toml | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Decide whether to release
        id: diff
        run: |
          NEW="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${NEW}" | grep -q .; then
            echo "v${NEW} already released — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Gate the release on a green suite. This runs before create-release so a
  # failure means no tag is pushed, no draft is created, and the Homebrew cask
  # is never touched — the version bump can simply be re-pushed after a fix.
  # macOS because the Keychain and shell-hook tests are macOS-only.
  test:
    runs-on: macos-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v5
        with:
          path: synapse

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: synapse

      - name: Test
        run: cargo test --locked

      # The root workspace holds the window and the wire format. Nearly every
      # test in the repository lives in synapsecore, which is its own workspace
      # root and so is not reached by the command above — without this step the
      # gate would let a broken memory engine through on a green run.
      - name: Test synapsecore
        working-directory: synapse/crates/synapsecore
        run: cargo test --locked

  create-release:
    runs-on: ubuntu-latest
    needs: [check-version, test]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      # Created as a draft and published by the `publish` job once the build has
      # uploaded to it. A published release is what `releases/latest` reports,
      # so publishing up front advertises a version for the length of a
      # notarization run with none of its assets attached yet. Drafts are
      # invisible to `releases/latest` and still accept uploads.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          draft: true

  build:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: synapse
    # Signing creds are optional: with a Developer ID the app is signed with a
    # hardened runtime and notarized; without them the build falls back to an
    # ad-hoc signature (runs locally, but unsigned for distribution).
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"
          path: synapse

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: synapse

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID Application cert into a temporary keychain so
          # codesign can find it. The keychain is wiped when the job ends.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build + sign (.app + .zip)
        env:
          SYNAPSE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/release

      # scripts/notarize staples the ticket and re-zips, so the uploaded archive
      # is the stapled one. Skipped without creds: the zip stays signed-only.
      - name: Notarize + staple
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: scripts/notarize

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist/synapse.app
          test -x dist/synapse.app/Contents/MacOS/synapse
          test -f dist/synapse.app/Contents/Resources/icon.icns
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — unsigned and not notarized; Gatekeeper will block on install."
          fi

      - name: Upload zip
        run: gh release upload "v${{ needs.check-version.outputs.version }}" dist/synapse.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Flip the draft live once the build has uploaded its archive.
  publish:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    # `!cancelled()` rather than `always()`: always() is also true for a
    # cancelled run, which would publish a release whose remaining jobs were
    # deliberately stopped.
    if: |
      !cancelled()
      && needs.check-version.outputs.changed == 'true'
      && needs.build.result == 'success'
    steps:
      - name: Publish the release
        run: gh release edit "v${{ needs.check-version.outputs.version }}" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, publish]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download zip and compute SHA
        id: shas
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/synapse/releases/download/v${VERSION}/synapse.zip"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/synapse.zip "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for synapse.zip... ($i/30)"
            sleep 10
          done
          # curl -f still creates the output file on an HTTP error, so without
          # this guard a run that exhausted every retry would hash a 0-byte file
          # and publish the empty-string digest as a working cask.
          if [ ! -s /tmp/synapse.zip ]; then
            echo "::error::synapse.zip never became downloadable from ${URL}"
            exit 1
          fi
          SHA=$(sha256sum /tmp/synapse.zip | cut -d' ' -f1)
          echo "sha_darwin_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p tap/Casks
          cat > tap/Casks/synapse.rb << 'RUBY'
          cask "synapse" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

            url "https://github.com/wess/synapse/releases/download/v#{version}/synapse.zip"
            name "Synapse"
            desc "Local memory and scoped credentials for developer tools"
            homepage "https://wess.io/synapse/"

            depends_on arch: :arm64
            depends_on macos: :ventura

            app "synapse.app"
            binary "#{appdir}/synapse.app/Contents/MacOS/synapse"

            zap trash: [
              "~/Library/Application Support/synapse",
              "~/Library/Preferences/app.synapse.desktop.plist",
              "~/Library/Saved Application State/app.synapse.desktop.savedState",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Casks/synapse.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${{ steps.shas.outputs.sha_darwin_arm64 }}/g" tap/Casks/synapse.rb

      - name: Push updated cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/synapse.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update synapse to v${{ needs.check-version.outputs.version }}"
            git push
          fi
