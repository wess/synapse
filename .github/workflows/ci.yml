name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with release.yml. guise-ui is a path dependency on a sibling
  # checkout, so every job that builds Rust must resolve ../guise/crates/guise
  # at the same ref the release build uses.
  GUISE_REF: v0.12.0

jobs:
  # macOS because the Keychain, shell-hook, and bundle tests are macOS-only —
  # on any other runner the suite silently skips the parts most worth checking.
  check:
    name: build · test · clippy
    runs-on: macos-latest
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v5
        with:
          path: synapse

      # Sibling checkout so Cargo.toml's ../guise/crates/guise path resolves.
      - uses: actions/checkout@v5
        with:
          repository: wess/guise
          ref: ${{ env.GUISE_REF }}
          path: guise

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: synapse

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Advisory: surfaces lints without failing the pipeline.
      - name: Clippy
        run: cargo clippy --all-targets
        continue-on-error: true

  # Advisory formatting check (does not block — run `cargo fmt` to apply).
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v5
        with:
          path: synapse

      # cargo fmt shells out to `cargo metadata`, which loads every workspace
      # member's manifest and so has to resolve ../guise/crates/guise. Without
      # this checkout the command fails before rustfmt runs at all, and
      # continue-on-error hides it — an advisory check that silently checks
      # nothing.
      - uses: actions/checkout@v5
        with:
          repository: wess/guise
          ref: ${{ env.GUISE_REF }}
          path: guise

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # No --all: it resolves through the guise path dependency and reports
      # that project's formatting as ours. The bare form covers every workspace
      # member and stops at the workspace boundary.
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true

  # The sync server, built the way somebody self-hosting would build it: Linux,
  # no guise checkout, no macOS, nothing from the desktop half on disk. The
  # workspace-level jobs cannot check this — synapseserve is its own workspace
  # root precisely so that it does not need any of that — so this job is what
  # keeps the server from quietly growing a dependency on the app.
  server:
    name: synapseserve · linux, no guise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/synapseserve
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/synapseserve

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # Verify the documentation site builds and passes its own link check. pages.yml
  # runs the same two commands on push to main; this extends the check to PRs.
  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun run site
      - run: bun run sitecheck
