name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS because the Keychain, shell-hook, and bundle tests are macOS-only —
  # on any other runner the suite silently skips the parts most worth checking.
  check:
    name: build · test · clippy
    runs-on: macos-latest
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v5
        with:
          path: synapse

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: synapse

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Advisory: surfaces lints without failing the pipeline.
      - name: Clippy
        run: cargo clippy --all-targets
        continue-on-error: true

  # Advisory formatting check (does not block — run `cargo fmt` to apply).
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse
    steps:
      - uses: actions/checkout@v5
        with:
          path: synapse

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The bare form covers every root workspace member and stops at the
      # workspace boundary.
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true

  # The terminal-only build, on the machine it exists for: Linux, no desktop
  # dependency graph, no display. This is the job that keeps the promise — the
  # property is invisible to every other job,
  # because they resolve the desktop graph and would keep passing on the day
  # synapsecore grew a dependency on the window.
  #
  # It carries the whole test suite, which the macOS job also runs: these tests
  # moved here with the binary they spawn, and running them on Linux is the only
  # place they are checked without a GPUI toolchain in reach.
  cli:
    name: synapsecore · linux, no guise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/synapsecore
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/synapsecore

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # The library has to stay usable without a screen, for the same reason it
      # has to stay buildable without guise: an embedder wants memory, not a
      # rendering stack. Nothing else checks this — every other build turns the
      # dashboard on by default.
      - name: Library without the dashboard
        run: cargo check --locked --no-default-features

      # The desktop crate is the release trigger; this crate is where
      # `synapse version` reads its number from. Drift means a signed build that
      # misreports itself, and nothing else would catch it.
      - name: Versions agree
        working-directory: .
        run: |
          app=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' crates/synapse/Cargo.toml | head -1)
          cli=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' crates/synapsecore/Cargo.toml | head -1)
          echo "synapse=$app synapsecore=$cli"
          test "$app" = "$cli"

  # The sync server, built the way somebody self-hosting would build it: Linux,
  # no desktop dependency graph, no macOS. The
  # workspace-level jobs cannot check this — synapseserve is its own workspace
  # root precisely so that it does not need any of that — so this job is what
  # keeps the server from quietly growing a dependency on the app.
  server:
    name: synapseserve · linux, no guise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/synapseserve
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/synapseserve

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # The pi package is TypeScript that ships inside the Rust binary —
  # relay/extension.rs embeds it so a launch can write it out for a pi that is
  # not connected yet. Nothing in the Rust suite compiles it, so without this a
  # type error would surface in somebody's session rather than in a build.
  pi:
    name: pi package · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check

  # Verify the documentation site builds and passes its own link check. pages.yml
  # runs the same two commands on push to main; this extends the check to PRs.
  site:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun run site
      - run: bun run sitecheck
