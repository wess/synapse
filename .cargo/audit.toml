[advisories]
# quick-xml 0.30 is retained for GPUI's optional xcb build dependency. It is not
# in the current enabled graph (`cargo tree --target all -i quick-xml@0.30.0`).
# The headless core and sync server do not depend on GPUI. Keep these exceptions
# explicit until the upstream optional dependency supports quick-xml >=0.41.
#
# RUSTSEC-2026-0459 is the SQLite bundled by libsqlite3-sys 0.30 (CVE-2026-119375):
# a database opened beside a crafted write-ahead log can return stale process
# memory. The fix is libsqlite3-sys >= 0.39, and no sqlx release accepts it —
# 0.9.0 still requires < 0.38 — so there is nothing to upgrade to yet. Every
# store Synapse opens is one it created, in a folder only its owner can write;
# the one path that opens a file somebody else could have made is
# `synapse data restore`, which refuses a source with a log beside it before
# SQLite sees either file (database/lifecycle.rs). Drop this the day sqlx moves.
# The desktop UI's current release pulls these maintenance-only advisories.
# None reports a vulnerability, but none has a patched release either. Their
# replacements require upstream API changes across the platform, font, HTTP,
# and archive layers; keep the exact list here so every new warning still
# fails CI. Recheck on every UI release and no later than 2027-02-12.
ignore = [
  "RUSTSEC-2024-0384", # instant, through the UI executor
  "RUSTSEC-2024-0436", # paste, through the macOS graphics bindings
  "RUSTSEC-2025-0052", # async-std, through archive downloads
  "RUSTSEC-2025-0134", # rustls-pemfile, through the HTTP client
  "RUSTSEC-2026-0173", # proc-macro-error2, through stacksafe
  "RUSTSEC-2026-0192", # ttf-parser, through text and SVG rendering
  "RUSTSEC-2026-0194", # quick-xml, optional xcb graph
  "RUSTSEC-2026-0195", # quick-xml, optional xcb graph
  "RUSTSEC-2026-0206", # rustybuzz, through text and SVG rendering
  "RUSTSEC-2026-0370", # zvariant, Linux platform graph
  "RUSTSEC-2026-0371", # zbus_names, Linux platform graph
  "RUSTSEC-2026-0372", # zvariant_derive, Linux platform graph
  "RUSTSEC-2026-0441", # pin-utils, through async-std
  "RUSTSEC-2026-0459", # bundled SQLite; restore rejects adjacent WAL state
]

[output]
# An exception above is a reviewed dependency constraint. Anything else is a
# regression, including a new maintenance warning or a yanked package.
deny = ["warnings"]
quiet = false
show_tree = true
